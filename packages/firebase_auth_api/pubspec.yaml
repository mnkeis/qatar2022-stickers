name: firebase_auth_api
description: Dart package which manages the authentication domain.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  auth_api:
    path: ../auth_api

  crypto: ^3.0.3
  equatable: ^2.0.5
  firebase_auth: ^4.19.6
  firebase_core: ^2.31.1
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  meta: ^1.12.0
  sign_in_with_apple: ^6.1.0

dev_dependencies:
  build_runner: ^2.4.10
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  very_good_analysis: ^5.1.0
