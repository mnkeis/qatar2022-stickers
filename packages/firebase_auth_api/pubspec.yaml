name: firebase_auth_api
description: Dart package which manages the authentication domain.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  auth_api:
    path: ../auth_api

  crypto: ^3.0.7
  equatable: ^2.0.8
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  meta: ^1.12.0
  sign_in_with_apple: ^8.0.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  very_good_analysis: ^10.2.0
